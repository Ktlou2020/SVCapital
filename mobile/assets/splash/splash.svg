  <!-- Protea flower centered at (1366, 1300), scaled 2.67× from 1024 canvas -->
  <g transform="translate(0, -220)">
    <!-- Petals rotating around (1366, 1821) -->
    <g style="mix-blend-mode: multiply">
      <ellipse cx="1366" cy="1063" rx="315" ry="806" fill="url(#sp1)" transform="rotate(-65 1366 1821)"/>
      <ellipse cx="1366" cy="1063" rx="315" ry="800" fill="url(#sp2)" transform="rotate(-44 1366 1821)"/>
      <ellipse cx="1366" cy="1069" rx="298" ry="794" fill="url(#sp3)" transform="rotate(-23 1366 1821)"/>
      <ellipse cx="1366" cy="1045" rx="288" ry="800" fill="url(#sp4)" transform="rotate(0 1366 1821)"/>
      <ellipse cx="1366" cy="1069" rx="304" ry="800" fill="url(#sp5)" transform="rotate(23 1366 1821)"/>
      <ellipse cx="1366" cy="1063" rx="315" ry="800" fill="url(#sp6)" transform="rotate(45 1366 1821)"/>
      <ellipse cx="1366" cy="1063" rx="315" ry="800" fill="url(#sp7)" transform="rotate(65 1366 1821)"/>
    </g>

    <!-- Small decorative leaves at base -->
    <g style="mix-blend-mode: multiply" opacity="0.92">
      <ellipse cx="993" cy="2219" rx="187" ry="67" fill="url(#sl1)" transform="rotate(-22 993 2219)"/>
      <ellipse cx="1366" cy="2309" rx="69" ry="133" fill="url(#sl2)"/>
      <ellipse cx="1737" cy="2219" rx="187" ry="67" fill="url(#sl3)" transform="rotate(22 1737 2219)"/>
    </g>
  </g>

  <!-- SV Capital wordmark below -->
  <text x="1366" y="2490" font-family="Georgia, 'Times New Roman', serif"
        font-size="110" font-weight="700" fill="#1a1a1a"
        text-anchor="middle" letter-spacing="22">SV CAPITAL</text>
  <text x="1366" y="2590" font-family="Arial, Helvetica, sans-serif"
        font-size="58" font-weight="400" fill="#888888"
        text-anchor="middle" letter-spacing="10">INVESTOR PORTAL</text>
</svg>
