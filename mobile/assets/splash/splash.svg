<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <rect width="2732" height="2732" fill="white"/>
  <defs>
    <radialGradient id="sp1" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#CC3D00"/>
      <stop offset="55%" stop-color="#E86020" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#F8B080" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="sp2" cx="50%" cy="52%" r="62%">
