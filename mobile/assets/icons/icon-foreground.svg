<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Transparent background — used as the foreground layer of Android adaptive icons.
       Content is scaled to ~67% so it stays within the 72dp safe zone of the 108dp canvas. -->
  <defs>
    <radialGradient id="fp1" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#CC3D00"/>
      <stop offset="55%" stop-color="#E86020" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#F8B080" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="fp2" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#E85800"/>
      <stop offset="55%" stop-color="#F59040" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#FFCF98" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="fp3" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#E8B800"/>
      <stop offset="55%" stop-color="#F5D048" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#FFF0AA" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="fp4" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#B848D8"/>
      <stop offset="55%" stop-color="#D080F0" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#EEC8FF" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="fp5" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#E05890"/>
      <stop offset="55%" stop-color="#F09CC0" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#FFD8EE" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="fp6" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#20A848"/>
      <stop offset="55%" stop-color="#58C870" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#B8EFCA" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="fp7" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#20A0C0"/>
      <stop offset="55%" stop-color="#50C0D8" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#A8EEF8" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="fl1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#28B070"/>
      <stop offset="100%" stop-color="#40C8C0" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="fl2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F080B8"/>
      <stop offset="100%" stop-color="#F8C8E0" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="fl3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3898D0"/>
      <stop offset="100%" stop-color="#90D8F0" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- Scaled to 67% and centered for adaptive icon safe zone -->
  <g transform="translate(512,512) scale(0.67) translate(-512,-512)">
    <g style="mix-blend-mode: multiply">
      <ellipse cx="512" cy="398" rx="118" ry="302" fill="url(#fp1)" transform="rotate(-65 512 682)"/>
      <ellipse cx="512" cy="398" rx="118" ry="300" fill="url(#fp2)" transform="rotate(-44 512 682)"/>
      <ellipse cx="512" cy="400" rx="112" ry="298" fill="url(#fp3)" transform="rotate(-23 512 682)"/>
      <ellipse cx="512" cy="392" rx="108" ry="300" fill="url(#fp4)" transform="rotate(0 512 682)"/>
      <ellipse cx="512" cy="400" rx="114" ry="300" fill="url(#fp5)" transform="rotate(23 512 682)"/>
      <ellipse cx="512" cy="398" rx="118" ry="300" fill="url(#fp6)" transform="rotate(45 512 682)"/>
      <ellipse cx="512" cy="398" rx="118" ry="300" fill="url(#fp7)" transform="rotate(65 512 682)"/>
    </g>
    <g style="mix-blend-mode: multiply" opacity="0.92">
      <ellipse cx="372" cy="832" rx="70" ry="25" fill="url(#fl1)" transform="rotate(-22 372 832)"/>
      <ellipse cx="512" cy="865" rx="26" ry="50" fill="url(#fl2)"/>
      <ellipse cx="651" cy="832" rx="70" ry="25" fill="url(#fl3)" transform="rotate(22 651 832)"/>
    </g>
  </g>
</svg>
