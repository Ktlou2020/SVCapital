<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accounting Data Loader — SV Capital</title>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a24;
      --border: #2a2a3a;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --text: #e2e8f0;
      --muted: #8892a4;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 3rem 2.5rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      margin-bottom: 0.5rem;
    }
    .logo span { color: var(--accent-light); }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
    }
    #status-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    #status-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    #status-msg {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      min-height: 3rem;
    }
    .progress-bar {
      background: var(--border);
      border-radius: 99px;
      height: 6px;
      margin-bottom: 2rem;
      overflow: hidden;
    }
    .progress-fill {
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      height: 100%;
      border-radius: 99px;
      width: 0%;
      transition: width 0.4s ease;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
      text-align: left;
    }
    .stat-card {
      background: #0f0f1a;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.25rem;
    }
    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-light);
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 0.6rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #6d28d9; }
    .btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
    .error-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 0.5rem;
      padding: 1rem;
      font-size: 0.85rem;
      color: var(--red);
      text-align: left;
      margin-bottom: 1.5rem;
      display: none;
    }
    .fsp-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 99px;
      padding: 0.3rem 0.85rem;
      font-size: 0.78rem;
      color: var(--accent-light);
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">SV <span>Capital</span></div>
    <div class="subtitle">Accounting Data Loader</div>

    <div class="fsp-badge">
      🛡️ Smartvest Financial Services · FSP 52449
    </div>

    <div id="status-icon">⏳</div>
    <div id="status-title">Preparing to load accounting data…</div>
    <div id="status-msg">Reading accounting-state.json generated by the sync script.</div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>

    <div class="stats-grid" id="stats-grid" style="display:none"></div>
    <div class="error-box" id="error-box"></div>

    <button class="btn" id="action-btn" disabled onclick="goToAccounting()">
      Open Accounting App
    </button>
  </div>

  <script>
    const SMARTVEST_FSP_NAME = 'Smartvest Financial Services';

    function setProgress(pct) {
      document.getElementById('progress').style.width = pct + '%';
    }
    function setStatus(icon, title, msg) {
      document.getElementById('status-icon').textContent = icon;
      document.getElementById('status-title').textContent = title;
      document.getElementById('status-msg').textContent = msg;
    }
    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg;
      box.style.display = 'block';
    }
    function renderStats(state) {
      const bid = Object.keys(state).find(k => k.startsWith('acct_businesses'));
      const businesses = bid ? JSON.parse(state[bid] || '[]') : [];
      const sv = businesses.find(b => b.name === SMARTVEST_FSP_NAME);
      if (!sv) return;
      const svId = sv.id;

      const txns = JSON.parse(state['acct_transactions_' + svId] || '[]');
      const balances = {};
      txns.forEach(t => {
        const coa = JSON.parse(state['acct_coa_' + svId] || '[]');
        (t.entries || []).forEach(e => {
          balances[e.account] = (balances[e.account] || 0) + (e.debit || 0) - (e.credit || 0);
        });
      });

      const coa = JSON.parse(state['acct_coa_' + svId] || '[]');
      const getBalance = (code) => {
        const acc = coa.find(a => a.code == code);
        if (!acc) return 0;
        const b = balances[acc.id] || 0;
        return ['Asset','Expense'].includes(acc.type) ? b : -b;
      };

      const statsEl = document.getElementById('stats-grid');
      const stats = [
        { label: 'Total Deposits', value: 'R ' + (getBalance(1000) > 0 ? getBalance(1000) : txns.filter(t=>t.type==='deposit').reduce((s,t)=>s+(t.amount||0),0)).toLocaleString('en-ZA', {minimumFractionDigits:2}) },
        { label: 'Platform Fees Earned', value: 'R ' + Math.abs(getBalance(4100)).toLocaleString('en-ZA', {minimumFractionDigits:2}) },
        { label: 'Active AUM', value: 'R ' + Math.abs(getBalance(1500)).toLocaleString('en-ZA', {minimumFractionDigits:2}) },
        { label: 'Return Income', value: 'R ' + Math.abs(getBalance(4200)).toLocaleString('en-ZA', {minimumFractionDigits:2}) },
        { label: 'Journal Entries', value: txns.reduce((s,t)=>(s+(t.entries||[]).length),0).toString() },
        { label: 'Transactions', value: txns.length.toString() },
      ];
      statsEl.innerHTML = stats.map(s => `
        <div class="stat-card">
          <div class="stat-label">${s.label}</div>
          <div class="stat-value">${s.value}</div>
        </div>
      `).join('');
      statsEl.style.display = 'grid';
    }

    function goToAccounting() {
      window.location.href = 'accounting.html';
    }

    async function loadState() {
      setProgress(10);
      setStatus('⏳', 'Fetching accounting data…', 'Loading accounting-state.json from disk.');

      let state;
      try {
        const res = await fetch('accounting-state.json?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + res.statusText);
        state = await res.json();
      } catch (err) {
        setStatus('❌', 'Failed to load state file', 'Could not read accounting-state.json. Make sure you ran the sync script first.');
        showError('Error: ' + err.message + '\n\nRun: node server/scripts/accounting-sync.js');
        setProgress(0);
        return;
      }

      setProgress(40);
      setStatus('📥', 'Writing to localStorage…', 'Injecting all accounting records into browser storage.');

      try {
        let written = 0;
        for (const [key, value] of Object.entries(state)) {
          localStorage.setItem(key, typeof value === 'string' ? value : JSON.stringify(value));
          written++;
        }
        setProgress(80);
        setStatus('📊', 'Computing statistics…', `${written} storage keys loaded successfully.`);
        renderStats(state);
        setProgress(100);
        setStatus('✅', 'Accounting data loaded!', 'All investment records have been loaded into the Smartvest Financial Services general ledger. Click the button below to open the Accounting app.');
        const btn = document.getElementById('action-btn');
        btn.disabled = false;
        btn.textContent = 'Open Accounting App →';
      } catch (err) {
        setStatus('❌', 'Storage error', 'Could not write to localStorage.');
        showError('localStorage error: ' + err.message);
        setProgress(0);
      }
    }

    loadState();
  </script>
</body>
</html>
