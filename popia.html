  <script>

    const DEFAULT_PRIVACY = `
<p>This Privacy Policy and POPIA Notice ("Policy") describes how SV Capital (Pty) Ltd ("SV Capital", "we", "us", or "our") collects, uses, stores, and discloses your personal information when you use our website, investor portal, and mobile application (collectively, the "Platform"). By registering on or using the Platform, you acknowledge that you have read, understood, and consent to the practices described in this Policy.</p>

<h2>1. Who We Are — Responsible Party</h2>
<p><strong>Responsible Party:</strong> SV Capital (Pty) Ltd</p>
<p><strong>Registration Number:</strong> 2017/194453/07</p>
<p><strong>FSP Licence:</strong> #52449 — Authorised Financial Services Provider (FSCA)</p>
<p><strong>Registered Address:</strong> South Africa</p>
<p><strong>Information Officer / Data Protection Officer:</strong> <a href="mailto:admin@svcapital.co.za">admin@svcapital.co.za</a></p>
<p><strong>General Enquiries:</strong> <a href="mailto:enquiry@svcapital.co.za">enquiry@svcapital.co.za</a></p>

<h2>2. Personal Information We Collect</h2>
<p>We collect the following categories of personal information from and about users of our Platform:</p>
<ul>
  <li><strong>Identity information:</strong> Full name, South African ID number, date of birth, passport number (for international clients), nationality, and tax reference number (TIN/SARS).</li>
  <li><strong>Contact information:</strong> Email address, phone number, and residential or postal address.</li>
  <li><strong>Financial information:</strong> Bank account details, wallet balance, investment history, transaction records, income and employment information, source of funds declarations, and net asset value.</li>
  <li><strong>FICA/KYC documents:</strong> Certified copy of ID or passport, proof of residence (not older than 3 months), proof of income or source of funds, and any other documentation required under the Financial Intelligence Centre Act (FICA).</li>
  <li><strong>Risk profile information:</strong> Investment risk appetite, financial goals, investment horizon, and experience.</li>
  <li><strong>Technical and usage data:</strong> IP address, device type, operating system, browser type, login timestamps, pages visited, session duration, and search queries on the Platform.</li>
  <li><strong>Cookies and tracking data:</strong> We use cookies, web beacons, and pixel tags to collect information about how you interact with the Platform. See clause 11 for more detail.</li>
  <li><strong>Communication data:</strong> Support tickets, messages, and correspondence you send to us.</li>
</ul>

<h2>3. How We Collect Your Information</h2>
<p>We collect personal information:</p>
<ul>
  <li><strong>Directly from you</strong> when you register, complete your profile, submit FICA documents, make investments, or contact our support team.</li>
  <li><strong>Automatically</strong> through your use of the Platform via cookies, analytics tools, and server logs.</li>
  <li><strong>From third parties</strong> such as identity verification services (e.g., Smile Identity), payment processors (e.g., Paystack, Ozow), and credit bureau or AML screening services as required by law.</li>
</ul>

<h2>4. Purposes of Processing</h2>
<p>We process your personal information for the following specific, lawful purposes:</p>
<ul>
  <li>Opening, verifying, and managing your investor account on the Platform.</li>
  <li>Performing Know Your Customer (KYC) and FICA identity verification as required by South African law.</li>
  <li>Processing investment applications, deposits, withdrawals, returns, and wallet transactions.</li>
  <li>Complying with Anti-Money Laundering (AML), Counter-Terrorist Financing (CTF), and Financial Intelligence Centre Act (FICA) obligations.</li>
  <li>Sending account statements, IT3(b) tax certificates, investment notifications, and maturity instructions.</li>
  <li>Fraud prevention, security monitoring, and audit trail maintenance.</li>
  <li>Communicating important platform or regulatory changes that affect your investments.</li>
  <li>Sending marketing and promotional communications — <strong>only with your explicit consent</strong>. You may withdraw this consent at any time.</li>
  <li>Improving and personalising your experience on the Platform.</li>
  <li>Reporting to the South African Revenue Service (SARS) as required under the Income Tax Act and other applicable legislation.</li>
  <li>Complying with any court order, subpoena, or other legal process or obligation.</li>
</ul>

<h2>5. Legal Basis for Processing (POPIA)</h2>
<p>In accordance with POPIA, we process your personal information on the following lawful grounds:</p>
<ul>
  <li><strong>Consent:</strong> For marketing communications, cookie analytics, and optional data sharing. You may withdraw consent at any time without affecting the lawfulness of prior processing.</li>
  <li><strong>Contractual necessity:</strong> To fulfil our obligations under your Investment Agency Agreement and manage your account and investments.</li>
  <li><strong>Legal obligation:</strong> To comply with FICA, FAIS, AML, SARS, POPIA, and other applicable South African laws and regulations.</li>
  <li><strong>Legitimate interest:</strong> For fraud prevention, platform security, internal analytics, and improvement of our services, where such interests are not overridden by your rights and freedoms.</li>
</ul>

<h2>6. Sharing Your Information</h2>
<p>We may share your personal information with the following parties, strictly on a need-to-know basis and subject to appropriate confidentiality obligations:</p>
<ul>
  <li><strong>Regulatory bodies:</strong> The Financial Sector Conduct Authority (FSCA), the Financial Intelligence Centre (FIC), and the South African Revenue Service (SARS), as required by applicable law.</li>
  <li><strong>Payment processors:</strong> Paystack and Ozow for deposit and payment verification purposes.</li>
  <li><strong>Identity verification providers:</strong> Smile Identity or similar providers for FICA/KYC compliance.</li>
  <li><strong>Banking and trust account partners:</strong> For investment pool management, fund holding, and payout processing.</li>
  <li><strong>Cloud and IT service providers:</strong> Hosting, database, and security providers who are contractually obligated to keep your information confidential and secure, and to use it only for specified purposes.</li>
  <li><strong>Fund manager:</strong> SmartVest Financial Services (FSP 52449) for investment oversight and FSCA reporting.</li>
  <li><strong>Compliance and legal advisors:</strong> For FICA, AML, and regulatory compliance assessments.</li>
  <li><strong>Law enforcement or courts:</strong> Where required by law or court order.</li>
</ul>
<p><strong>We do not sell, rent, or trade your personal information to any third party for commercial purposes.</strong></p>

<h2>7. International Transfers</h2>
<p>Your personal information may be transferred to, stored at, or processed in countries other than South Africa — for example, on international cloud servers used by our technology partners. Where such transfers occur, we take reasonable steps to ensure that your information is handled in accordance with POPIA and this Policy, including ensuring that appropriate safeguards (such as data processing agreements) are in place with the relevant third parties.</p>

<h2>8. Retention of Personal Information</h2>
<p>We retain your personal information for the following minimum periods, after which it will be securely deleted or anonymised:</p>
<ul>
  <li><strong>FICA/KYC documents:</strong> 5 years after the termination of the business relationship (as required by FICA).</li>
  <li><strong>Transaction records and investment history:</strong> 5 years after the transaction date (FAIS and SARS requirements).</li>
  <li><strong>Account information:</strong> For the duration of your account plus 5 years thereafter.</li>
  <li><strong>Audit logs and security records:</strong> 3 years from the date of the event.</li>
  <li><strong>Marketing consent records:</strong> Until you withdraw consent or close your account.</li>
  <li><strong>Support communications:</strong> 2 years after the matter is resolved.</li>
</ul>
<p>Longer retention periods may apply where required by law or where the information is necessary for pending legal proceedings or regulatory investigations.</p>

<h2>9. Your Rights Under POPIA</h2>
<p>In terms of POPIA and applicable data protection principles, you have the following rights regarding your personal information:</p>
<ul>
  <li><strong>Right to access:</strong> You may request a copy of the personal information we hold about you.</li>
  <li><strong>Right to correction:</strong> You may request that we correct inaccurate, incomplete, or outdated personal information.</li>
  <li><strong>Right to deletion:</strong> You may request the deletion of your personal information, subject to our legal retention obligations.</li>
  <li><strong>Right to object:</strong> You may object to the processing of your personal information for marketing purposes or other purposes based on legitimate interest.</li>
  <li><strong>Right to withdraw consent:</strong> Where processing is based on your consent, you may withdraw that consent at any time. Withdrawal does not affect the lawfulness of prior processing.</li>
  <li><strong>Right to complain:</strong> You may lodge a complaint with the Information Regulator of South Africa if you believe we have violated your privacy rights.</li>
  <li><strong>Right to data portability:</strong> In certain circumstances, you may request that we provide your personal information in a structured, commonly used format.</li>
</ul>
<p>To exercise any of these rights, please contact our Information Officer at <a href="mailto:admin@svcapital.co.za">admin@svcapital.co.za</a>. We will respond to all requests within 30 days in accordance with POPIA.</p>

<h2>10. Security Measures</h2>
<p>We implement appropriate technical and organisational security measures to protect your personal information against unauthorised access, disclosure, loss, or destruction. These include:</p>
<ul>
  <li>256-bit SSL/TLS encryption for all data transmitted to and from the Platform.</li>
  <li>Encrypted storage for all sensitive documents and personal information at rest.</li>
  <li>Role-based access controls ensuring only authorised SV Capital personnel can access your data.</li>
  <li>Two-factor authentication options for investor accounts.</li>
  <li>Regular security audits and penetration testing.</li>
  <li>Strict employee data handling training and confidentiality agreements.</li>
  <li>Incident response procedures for security breaches, including notification to you and the Information Regulator where required by law.</li>
</ul>
<p>Please note that no method of internet transmission or electronic storage is completely secure. While we take every reasonable precaution, we cannot guarantee the absolute security of your information.</p>

<h2>11. Cookies and Tracking Technologies</h2>
<p>Our Platform uses cookies and similar tracking technologies (including web beacons and pixel tags) to:</p>
<ul>
  <li><strong>Essential cookies:</strong> Maintain your session, authentication state, and security. These cannot be disabled as they are necessary for the Platform to function.</li>
  <li><strong>Analytics cookies:</strong> Understand how you use the Platform so we can improve it (e.g., Google Analytics). These are only set with your consent.</li>
  <li><strong>Marketing cookies:</strong> Track the effectiveness of our marketing campaigns. These are only set with your explicit consent.</li>
</ul>
<p>You may manage cookie preferences through your browser settings. Disabling essential cookies may affect Platform functionality. By continuing to use the Platform, you consent to our use of analytics and marketing cookies where you have indicated consent during registration.</p>

<h2>12. Children's Privacy</h2>
<p>The Platform is not directed to persons under the age of 18, and we do not knowingly collect personal information from minors. If you are a parent or guardian and believe that your child has provided us with personal information without your consent, please contact us immediately at <a href="mailto:admin@svcapital.co.za">admin@svcapital.co.za</a>. We will take prompt steps to delete such information from our records.</p>

<h2>13. Your Choices</h2>
<p>You have the following choices regarding the use of your personal information:</p>
<ul>
  <li><strong>Marketing communications:</strong> You may opt out of receiving marketing emails at any time by clicking the "Unsubscribe" link in any marketing email or by contacting us at <a href="mailto:admin@svcapital.co.za">admin@svcapital.co.za</a>. Please note that opting out of marketing does not affect essential account communications.</li>
  <li><strong>Cookie preferences:</strong> You may manage cookie settings through your browser. Note that disabling cookies may affect your experience on the Platform.</li>
  <li><strong>Account closure:</strong> You may request closure of your account at any time, subject to the completion of any active investment periods and our legal retention obligations.</li>
</ul>

<h2>14. POPIA Compliance Statement</h2>
<p>SV Capital (Pty) Ltd is committed to full compliance with the Protection of Personal Information Act 4 of 2013 (POPIA) and the regulations promulgated thereunder. We adhere to the eight Conditions for Lawful Processing set out in POPIA, namely:</p>
<ul>
  <li><strong>Accountability:</strong> We take responsibility for all personal information in our possession.</li>
  <li><strong>Processing limitation:</strong> We collect only what is necessary and process it only for specified purposes.</li>
  <li><strong>Purpose specification:</strong> Personal information is collected for specific, defined, and lawful purposes.</li>
  <li><strong>Further processing limitation:</strong> We do not process your information in a manner incompatible with the purposes for which it was collected.</li>
  <li><strong>Information quality:</strong> We take steps to ensure your information is accurate, complete, and up to date.</li>
  <li><strong>Openness:</strong> We maintain transparency about how we process your information through this Policy.</li>
  <li><strong>Security safeguards:</strong> We implement appropriate technical and organisational measures to protect your information.</li>
  <li><strong>Data subject participation:</strong> We honour your rights to access, correct, and object to the processing of your personal information.</li>
</ul>
<p>You may contact our Information Regulator at:</p>
<ul>
  <li><strong>The Information Regulator (South Africa)</strong></li>
  <li>Email: <a href="mailto:inforeg@justice.gov.za">inforeg@justice.gov.za</a></li>
  <li>Website: <a href="https://inforegulator.org.za" target="_blank" rel="noopener">www.inforegulator.org.za</a></li>
</ul>

<h2>15. Changes to This Policy</h2>
<p>We may update this Privacy Policy and POPIA Notice from time to time to reflect changes in our practices, technology, or legal requirements. We will notify you of material changes by email or by posting a prominent notice on the Platform at least 30 days before the changes take effect. Your continued use of the Platform after the effective date of any changes constitutes your acceptance of the updated Policy. You are encouraged to review this Policy periodically.</p>

<h2>16. Contact Us</h2>
<div style="background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;padding:20px 24px;margin-top:12px">
  <p><strong>Information Officer / Data Protection Officer</strong><br>
  SV Capital (Pty) Ltd<br>
  Email: <a href="mailto:admin@svcapital.co.za">admin@svcapital.co.za</a><br>
  General: <a href="mailto:enquiry@svcapital.co.za">enquiry@svcapital.co.za</a><br>
  FSP #52449 — FSCA Authorised Financial Services Provider</p>
  <p style="margin-top:12px;font-size:0.85rem;color:#6b7280">For complaints that we have not resolved to your satisfaction, you may lodge a complaint with the Information Regulator of South Africa at <a href="mailto:inforeg@justice.gov.za">inforeg@justice.gov.za</a>.</p>
</div>
`;

    (async () => {
      const el = document.getElementById('privacyContent');
      try {
        const res = await fetch('/api/legal/privacy-content');
        if (res.ok) {
          const data = await res.json();
          if (data.content) {
            el.innerHTML = data.content;
            if (data.updatedAt) {
              const d = new Date(data.updatedAt);
              document.getElementById('lastUpdated').textContent = 'Last updated: ' + d.toLocaleDateString('en-ZA', { year: 'numeric', month: 'long' });
            }
            return;
          }
        }
      } catch (_) {}
      el.innerHTML = DEFAULT_PRIVACY;
    })();
  </script>
</body>
</html>
